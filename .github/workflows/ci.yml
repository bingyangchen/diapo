name: CI

on:
  pull_request:

# `make install` runs the install scripts of every dependency, so the token stays read-only
# whatever the repository's default permissions are.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      markdown-only: ${{ steps.diff.outputs.markdown-only }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only)
          if grep -qv '\.md$' <<< "$files"; then
            echo "markdown-only=false" >> "$GITHUB_OUTPUT"
          else
            echo "markdown-only=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    # Nothing below checks Markdown, so a PR that changes only .md files skips this job.
    # GitHub counts a job skipped by its condition as passing a required check, whereas a
    # workflow skipped by `paths-ignore` would leave the check pending and block the merge.
    # `!cancelled()` keeps this job running when the `changes` job fails.
    if: ${{ !cancelled() && needs.changes.outputs.markdown-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, so the token is not left in .git/config for those scripts.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
      - run: make check
      - run: make build-site
      - run: make e2e
